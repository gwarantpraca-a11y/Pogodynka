{% extends "weather/base.html" %}

{% block tresc %}
<div class="bg-white rounded-2xl shadow-xl p-8 w-80">
    <h1 class="text-2xl font-bold text-slate-800 mb-4 text-center">Logowanie</h1>

    {% if form.errors %}
        <p class="text-red-600 mb-4 text-center">Nieprawidłowy login lub hasło.</p>
    {% endif %}

    <form method="post"
          class="space-y-4 [&_input]:w-full [&_input]:border [&_input]:border-gray-300 [&_input]:rounded-lg [&_input]:px-3 [&_input]:py-2">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
                class="w-full bg-slate-800 text-white rounded-lg py-2 hover:bg-slate-700">
            Zaloguj
        </button>
    </form>
</div>
{% endblock %}
