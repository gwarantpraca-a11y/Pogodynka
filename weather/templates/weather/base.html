<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pogodynka</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex flex-col bg-linear-to-br from-lime-400 to-cyan-400">
    <nav class="flex justify-end items-center gap-4 p-4 text-slate-800">
        {% if user.is_authenticated %}
            <span>Zalogowany jako <b>{{ user.username }}</b></span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="underline">Wyloguj</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="underline">Zaloguj</a>
        {% endif %}
    </nav>

    <main class="flex-1 flex items-center justify-center">
        {% block tresc %}{% endblock %}
    </main>
</body>
</html>
