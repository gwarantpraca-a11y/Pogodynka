<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pogodynka</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-linear-to-br from-lime-400 to-cyan-400">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-80 text-center">
        <h1 class="text-3xl font-bold text-slate-800 mb-4">Pogodynka</h1>

        <form method="get" class="flex gap-2 mb-6">
            <input type="text" name="miasto" placeholder="Wpisz miasto"
                   class="flex-1 min-w-0 border border-gray-300 rounded-lg px-3 py-2">
            <button type="submit"
                    class="bg-slate-800 text-white rounded-lg px-4 py-2 hover:bg-slate-700">
                Sprawdź
            </button>
        </form>

        {% if blad %}
            <p class="text-red-600">{{ blad }} ({{ miasto }})</p>
        {% else %}
            <h2 class="text-xl font-semibold">{{ miasto }}, {{ kraj }}</h2>
            <div class="text-6xl font-bold text-slate-800 my-4">{{ temperatura }}°C</div>
            <p class="text-gray-500">{{ opis }}</p>
            <div class="flex justify-around mt-6 text-gray-700">
                <span>💧 {{ wilgotnosc }} %</span>
                <span>💨 {{ wiatr }} km/h</span>
            </div>
        {% endif %}
    </div>
</body>
</html>
