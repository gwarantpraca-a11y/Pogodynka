{% extends "weather/base.html" %}

{% block tresc %}
<div class="bg-white rounded-2xl shadow-xl p-8 w-96">
    <h1 class="text-2xl font-bold text-slate-800 mb-4 text-center">Rejestracja</h1>

    <form method="post"
          class="space-y-4 [&_input]:w-full [&_input]:border [&_input]:border-gray-300 [&_input]:rounded-lg [&_input]:px-3 [&_input]:py-2 [&_.helptext]:block [&_.helptext]:text-xs [&_.helptext]:text-gray-500 [&_ul]:text-xs [&_ul]:text-gray-500 [&_ul]:list-disc [&_ul]:pl-5 [&_.errorlist]:text-red-600">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
                class="w-full bg-slate-800 text-white rounded-lg py-2 hover:bg-slate-700">
            Załóż konto
        </button>
    </form>
</div>
{% endblock %}
